name: Release

# Kontrollerne koerer paa HVER push og hver PR, ikke kun paa tags. En .otf, en
# font uden licenstekst eller en readme der er bagud skal fanges naar den
# committes — ikke foerst naar nogen udgiver, hvor den allerede har ligget
# offentligt i dagevis.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

jobs:
  # Ugated: skal ogsaa kunne koere paa en anden forge.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Statiske kontroller
        # Tagget gives kun med naar der ER et tag; saa tjekker scriptet ogsaa
        # at det matcher Version i style.css. ci/checks.sh kan koeres i
        # haanden med samme argument.
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            ci/checks.sh "${GITHUB_REF_NAME}"
          else
            ci/checks.sh
          fi

      - name: Byg zip og bevis mappenavnet
        run: |
          set -euo pipefail
          THEME=garageristeriet
          rm -rf build && mkdir -p "build/$THEME"
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.gitea' \
            --exclude 'ci' --exclude 'build' --exclude 'node_modules' \
            ./ "build/$THEME"/
          (cd build && zip -rq "../$THEME.zip" "$THEME")
          # Oeverste mappe SKAL vaere temamappen, ellers installerer
          # WordPress en kopi ved siden af den gamle.
          test "$(unzip -Z1 "$THEME.zip" | cut -d/ -f1 | sort -u)" = "$THEME"

      - uses: actions/upload-artifact@v4
        with:
          name: theme-zip
          path: garageristeriet.zip

  # Gated to gange: kun paa et tag, og kun paa GitHub. action-gh-release
  # publicerer til den forge der koerer den, saa uden vaerts-gaten laver hvert
  # tag en halv release paa en spejling.
  publish:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') && github.server_url == 'https://github.com'
    # GITHUB_TOKEN er read-only som standard paa dette repo, og at oprette en
    # release er en skrivning. Uden dette fejler action-gh-release med
    # "403 Resource not accessible by integration" — en fejl der peger paa
    # token'et og ikke paa det der mangler. Kun her: test skal ikke kunne
    # skrive noget.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme-zip

      - uses: softprops/action-gh-release@v2
        with:
          files: garageristeriet.zip
          fail_on_unmatched_files: true
