name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # Ugated: koerer ogsaa paa Gitea, saa auto-merge kan laese resultatet.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version i style.css skal matche tagget
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          CSS_VERSION=$(sed -n 's/^Version:[[:space:]]*//p' style.css | head -1 | tr -d '\r')
          echo "tag=$TAG css=$CSS_VERSION"
          test "$CSS_VERSION" = "$TAG"

      - name: PHP-syntaks
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: Byg zip og bevis mappenavnet
        run: |
          set -euo pipefail
          THEME=garageristeriet
          rm -rf build && mkdir -p "build/$THEME"
          rsync -a \
            --exclude '.git' --exclude '.github' --exclude '.gitea' \
            --exclude 'ci' --exclude 'build' --exclude 'node_modules' \
            ./ "build/$THEME"/
          (cd build && zip -rq "../$THEME.zip" "$THEME")
          # Oeverste mappe SKAL vaere temamappen, ellers installerer
          # WordPress en kopi ved siden af den gamle.
          test "$(unzip -Z1 "$THEME.zip" | cut -d/ -f1 | sort -u)" = "$THEME"

      - uses: actions/upload-artifact@v4
        with:
          name: theme-zip
          path: garageristeriet.zip

  # Gated: action-gh-release publicerer til den forge der koerer den.
  # Uden denne gate laver hvert tag ogsaa en halv release paa Gitea.
  publish:
    needs: test
    if: github.server_url == 'https://github.com'
    # GITHUB_TOKEN er read-only som standard på dette repo, og at oprette en
    # release er en skrivning. Uden dette fejler action-gh-release med
    # "403 Resource not accessible by integration" — en fejl der peger på
    # token'et og ikke på det der mangler. Kun her, ikke på test-jobbet:
    # det skal ikke kunne skrive noget.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: theme-zip

      - uses: softprops/action-gh-release@v2
        with:
          files: garageristeriet.zip
          fail_on_unmatched_files: true
